<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800" role="img" aria-label="Mockup: Tiến bộ">
  <style>
    text { font-family: 'Be Vietnam Pro', 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1E2230; }
    .soft { fill: #5B6172; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 16px; font-weight: 700; }
    .b { font-size: 14px; }
    .s { font-size: 12px; }
    .big { font-size: 24px; font-weight: 700; }
    .ic { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0.5" y="0.5" width="389" height="799" rx="36" fill="#FAF7F2" stroke="#E7E1D8"/>
  <text x="24" y="80" class="h1">Tiến bộ</text>
  <text x="24" y="104" class="s soft">4 tuần gần nhất</text>

  <g>
    <rect x="16" y="122" width="112" height="80" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
    <text x="32" y="160" class="big">18</text><text x="32" y="184" class="s soft">ngày đã học</text>
    <rect x="139" y="122" width="112" height="80" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
    <text x="155" y="160" class="big">4,5 g</text><text x="155" y="184" class="s soft">tổng thời gian</text>
    <rect x="262" y="122" width="112" height="80" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
    <text x="278" y="160" class="big">92%</text><text x="278" y="184" class="s soft">nhớ khi ôn</text>
  </g>

  <!-- Minutes per day -->
  <rect x="16" y="218" width="358" height="170" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
  <text x="36" y="248" class="h2">Phút mỗi ngày</text>
  <path d="M36 356 H354" stroke="#E7E1D8"/>
  <path d="M36 296 H354" stroke="#E7E1D8" stroke-dasharray="3 4"/>
  <text x="326" y="290" class="s soft">15'</text>
  <g fill="#3B5BDB">
    <rect x="40" y="306" width="14" height="50" rx="3"/>
    <rect x="62" y="296" width="14" height="60" rx="3"/>
    <rect x="84" y="316" width="14" height="40" rx="3"/>
    <rect x="106" y="351" width="14" height="5" rx="2" fill="#E7E1D8"/>
    <rect x="128" y="292" width="14" height="64" rx="3"/>
    <rect x="150" y="298" width="14" height="58" rx="3"/>
    <rect x="172" y="276" width="14" height="80" rx="3"/>
    <rect x="194" y="296" width="14" height="60" rx="3"/>
    <rect x="216" y="351" width="14" height="5" rx="2" fill="#E7E1D8"/>
    <rect x="238" y="300" width="14" height="56" rx="3"/>
    <rect x="260" y="296" width="14" height="60" rx="3"/>
    <rect x="282" y="286" width="14" height="70" rx="3"/>
    <rect x="304" y="296" width="14" height="60" rx="3"/>
    <rect x="326" y="296" width="14" height="60" rx="3" fill="#F2A93B"/>
  </g>
  <text x="36" y="376" class="s soft">14 ngày trước</text><text x="310" y="376" class="s soft">Hôm nay</text>

  <!-- Errors trend -->
  <rect x="16" y="404" width="358" height="130" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
  <text x="36" y="434" class="h2">Lỗi mạo từ mỗi tuần</text>
  <rect x="268" y="420" width="88" height="22" rx="11" fill="#E3F6EC"/><text x="280" y="435" class="s" style="fill:#1F7A52">↓ giảm 60%</text>
  <path d="M46 466 L136 478 L226 496 L316 510" class="ic" style="stroke:#F2A93B"/>
  <g fill="#F2A93B"><circle cx="46" cy="466" r="4"/><circle cx="136" cy="478" r="4"/><circle cx="226" cy="496" r="4"/><circle cx="316" cy="510" r="4"/></g>
  <text x="36" y="526" class="s soft">T1: 10</text><text x="292" y="526" class="s soft">T4: 4</text>

  <!-- Can-do -->
  <rect x="16" y="550" width="358" height="188" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
  <text x="36" y="580" class="h2">Tôi có thể… (B1)</text>
  <g class="b">
    <circle cx="46" cy="610" r="10" fill="#E3F6EC"/><path d="M41 610 l4 4 l6 -7" class="ic" style="stroke:#2F9E6E"/>
    <text x="66" y="615">Cập nhật tiến độ trong standup</text>
    <circle cx="46" cy="646" r="10" fill="#E3F6EC"/><path d="M41 646 l4 4 l6 -7" class="ic" style="stroke:#2F9E6E"/>
    <text x="66" y="651">Viết bug report rõ ràng</text>
    <circle cx="46" cy="682" r="10" fill="none" stroke="#E7E1D8" stroke-width="2"/>
    <text x="66" y="687">Phản hồi code review lịch sự</text>
    <circle cx="46" cy="718" r="10" fill="none" stroke="#E7E1D8" stroke-width="2"/>
    <text x="66" y="723" class="soft">Giải thích một quyết định kỹ thuật</text>
  </g>

  <rect x="16" y="752" width="358" height="34" rx="12" fill="#E8EDFF"/>
  <text x="62" y="774" class="s" style="fill:#3B5BDB;font-weight:700">So với bản ghi âm ngày đầu  →  Nghe lại</text>
</svg>
