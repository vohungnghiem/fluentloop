<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800" role="img" aria-label="Mockup: bước Dùng và Sửa">
  <style>
    text { font-family: 'Be Vietnam Pro', 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1E2230; }
    .soft { fill: #5B6172; }
    .h2 { font-size: 18px; font-weight: 700; }
    .b { font-size: 15px; }
    .s { font-size: 12px; }
    .en { font-size: 18px; }
    .ic { fill: none; stroke: #1E2230; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0.5" y="0.5" width="389" height="799" rx="36" fill="#FAF7F2" stroke="#E7E1D8"/>

  <!-- Step bar -->
  <path d="M28 54 L40 66 M40 54 L28 66" class="ic" style="stroke:#5B6172"/>
  <g>
    <rect x="60" y="56" width="44" height="6" rx="3" fill="#3B5BDB"/>
    <rect x="110" y="56" width="44" height="6" rx="3" fill="#3B5BDB"/>
    <rect x="160" y="56" width="44" height="6" rx="3" fill="#3B5BDB"/>
    <rect x="210" y="56" width="44" height="6" rx="3" fill="#3B5BDB"/>
    <rect x="260" y="56" width="44" height="6" rx="3" fill="#3B5BDB"/>
    <rect x="310" y="56" width="44" height="6" rx="3" fill="#E7E1D8"/>
  </g>
  <text x="60" y="88" class="s soft">BƯỚC 5/6 · SỬA</text>

  <!-- Task -->
  <rect x="16" y="104" width="358" height="92" rx="18" fill="#E8EDFF"/>
  <path d="M36 124 l14 14 l-4 4 l-14 -14 Z M32 138 l4 4 l-6 2 Z" fill="#3B5BDB"/>
  <text x="62" y="134" class="s" style="fill:#3B5BDB;font-weight:700">NHIỆM VỤ</text>
  <text x="36" y="160" class="b">Viết 2 câu standup về hôm qua và hôm</text>
  <text x="36" y="180" class="b">nay, dùng <tspan style="font-weight:700">"blocked by"</tspan>.</text>

  <!-- Your answer with diff -->
  <text x="20" y="232" class="s soft">CÂU CỦA BẠN</text>
  <rect x="16" y="244" width="358" height="132" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
  <text x="36" y="280" class="en">Yesterday I</text>
  <rect x="134" y="262" width="30" height="26" rx="5" fill="#FFF3DC"/>
  <text x="137" y="280" class="en" style="fill:#A86A0C;text-decoration:line-through">fix</text>
  <path d="M137 275 H161" stroke="#A86A0C" stroke-width="1.5"/>
  <rect x="168" y="262" width="44" height="26" rx="5" fill="#E3F6EC"/>
  <text x="171" y="280" class="en" style="fill:#1F7A52;font-weight:700">fixed</text>
  <text x="218" y="280" class="en">the login</text>
  <text x="36" y="312" class="en">bug. Today I'm blocked by</text>
  <rect x="268" y="294" width="40" height="26" rx="5" fill="#E3F6EC"/>
  <text x="272" y="312" class="en" style="fill:#1F7A52;font-weight:700">the</text>
  <text x="314" y="312" class="en">API</text>
  <text x="36" y="344" class="en">team.</text>
  <text x="250" y="358" class="s soft">2 chỗ sửa</text>

  <!-- Natural -->
  <rect x="16" y="392" width="358" height="76" rx="18" fill="#E3F6EC"/>
  <text x="36" y="420" class="s" style="fill:#1F7A52;font-weight:700">TỰ NHIÊN HƠN</text>
  <text x="36" y="448" class="b">"…I'm blocked by the API team on the token."</text>
  <circle cx="350" cy="414" r="12" fill="#FFFFFF"/><path d="M345 410 h3 l4 -3 v14 l-4 -3 h-3 Z" fill="#1F7A52"/>

  <!-- Explanations -->
  <rect x="16" y="484" width="358" height="134" rx="18" fill="#FFFFFF" stroke="#E7E1D8"/>
  <rect x="36" y="502" width="86" height="22" rx="11" fill="#FFF3DC"/><text x="46" y="517" class="s" style="fill:#A86A0C">thì quá khứ</text>
  <text x="36" y="548" class="b">Có "yesterday", động từ ở quá khứ: fixed.</text>
  <rect x="36" y="566" width="62" height="22" rx="11" fill="#FFF3DC"/><text x="46" y="581" class="s" style="fill:#A86A0C">mạo từ</text>
  <text x="36" y="608" class="b">Đội cụ thể bạn đang nói tới: the API team.</text>

  <!-- Add to review -->
  <rect x="16" y="634" width="358" height="48" rx="14" fill="#FFFFFF" stroke="#E7E1D8"/>
  <rect x="34" y="648" width="20" height="20" rx="5" fill="#3B5BDB"/><path d="M39 658 l4 4 l7 -8" class="ic" style="stroke:#fff"/>
  <text x="66" y="663" class="b">Thêm 2 lỗi này vào thẻ ôn</text>

  <!-- Primary -->
  <rect x="16" y="712" width="358" height="56" rx="16" fill="#3B5BDB"/>
  <text x="178" y="746" class="b" style="fill:#fff;font-weight:700;font-size:17px">Tiếp</text>
  <rect x="318" y="728" width="36" height="24" rx="6" fill="none" stroke="#7C93F0"/><text x="329" y="745" class="s" style="fill:#fff">↵</text>
</svg>
